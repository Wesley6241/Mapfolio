<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MapFolio · Landing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kapakana&display=swap" rel="stylesheet">
</head>
<body class="landing-body">

  <!-- 顶部"跳过" -->
  <button id="skipBtn" class="skip">Skip to Map →</button>

  <!-- Frame 1: Landing Frame1 with target and covering mask -->
  <section id="frame1" class="landing-frame active">
    <div class="frame-background">
      <img src="/static/image/landing-bg-frame1.svg" alt="Background Frame 1" class="bg-image">
    </div>
    <div class="covering-mask">
      <div class="mask-gradient">
        <div class="particles-container"></div>
      </div>
      <div class="vector-element"></div>
    </div>
    <div class="target-element">
      <img src="/static/image/target-icon.svg" alt="Target" class="target-icon">
    </div>
  </section>

  <!-- Frame 2: Landing Frame2 with reduced covering mask -->
  <section id="frame2" class="landing-frame">
    <div class="frame-background">
      <img src="/static/image/landing-bg-frame2.svg" alt="Background Frame 2" class="bg-image">
    </div>
    <div class="covering-mask frame2-mask">
      <div class="mask-gradient">
        <div class="particles-container"></div>
      </div>
    </div>
  </section>

  <!-- Frame 3: Landing Frame3 with MapFolio text and minimal mask -->
  <section id="frame3" class="landing-frame">
    <div class="frame-background">
      <img src="/static/image/landing-bg-frame3.svg" alt="Background Frame 3" class="bg-image frame3-bg">
    </div>
    <div class="covering-mask frame3-mask">
      <div class="mask-gradient">
        <div class="particles-container"></div>
      </div>
      <div class="vector-element frame3-vector"></div>
    </div>
    <div class="mapfolio-text">
      <h1 class="mapfolio-title">MapFolio</h1>
    </div>
  </section>

  <div class="hint" id="hint">Scroll / ↑↓ / Gesture · 1 / 3</div>

  <script src="/static/js/landing.js"></script>
</body>
</html>
